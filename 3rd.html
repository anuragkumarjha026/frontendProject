<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<h2>Student Details</h2>

<table>
    <tr>
        <th>Photo</th>
        <th>Roll No</th>
        <th>Name</th>
        <th>Class</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td><img src="https://via.placeholder.com/80" alt="Student 1"></td>
        <td>101</td>
        <td>Rahul</td>
        <td>10th</td>
        <td>92</td>
    </tr>

    <tr>
        <td><img src="https://via.placeholder.com/80" alt="Student 2"></td>
        <td>102</td>
        <td>Priya</td>
        <td>10th</td>
        <td>88</td>
    </tr>

    <tr>
        <td><img src="https://via.placeholder.com/80" alt="Student 3"></td>
        <td>103</td>
        <td>Arjun</td>
        <td>10th</td>
        <td>95</td>
    </tr>

    <tr>
        <td><img src="https://via.placeholder.com/80" alt="Student 4"></td>
        <td>104</td>
        <td>Sneha</td>
        <td>10th</td>
        <td>90</td>
    </tr>

</table>

</body>
</html>
